<div class="dashboard-container">
  <!-- Encabezado -->
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">
      <i class="fas fa-tachometer-alt me-2"></i> Centro de Control
    </h1>

    <!-- Botón cerrar sesión -->
    <button class="btn btn-gradient" (click)="cerrarSesion()">
      <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
    </button>
  </header>

  <!-- Texto de bienvenida -->
  <p class="lead text-muted mb-4">
    ¡Bienvenido! Administra tus viajes, países y configuraciones desde aquí.
  </p>

  <!-- Botones de navegación -->
  <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
    <button class="btn btn-success btn-lg shadow" (click)="alternar('viajes')">
      <i class="fas fa-plane me-2"></i> Nuevo Viaje
    </button>
    <button class="btn btn-warning btn-lg shadow text-dark" (click)="alternar('ajustes')">
      <i class="fas fa-cogs me-2"></i> Ajustes
    </button>
    <button class="btn btn-info btn-lg shadow text-white" (click)="alternar('paises')">
      <i class="fas fa-globe-americas me-2"></i> Países
    </button>
  </div>

  <!-- Contenido dinámico -->
  <div class="dashboard-components mt-5 p-3 bg-light rounded shadow-sm animate-fade">
    <app-trips *ngIf="mostrarViajes"></app-trips>
    <app-settings *ngIf="mostrarAjustes"></app-settings>
    <app-countries *ngIf="mostrarPaises"></app-countries>
  </div>
</div>
