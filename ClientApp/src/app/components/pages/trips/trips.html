<div class="container py-4">
  <h2 class="text-primary mb-4">
    <i class="fas fa-plane-departure me-2"></i> Mis Viajes
  </h2>

  <div *ngFor="let trip of trips" class="card mb-3 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ trip.destination }}</h5>
      <p class="card-text"><strong>Fecha:</strong> {{ trip.date }}</p>
      <p class="card-text"><strong>Notas:</strong> {{ trip.notes }}</p>
    </div>
  </div>

  <button class="btn btn-success mt-3">
    <i class="fas fa-plus me-2"></i> Nuevo Viaje
  </button>
</div>
