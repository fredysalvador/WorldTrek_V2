<div class="container py-4">

  <h2 class="text-primary mb-4">
    <i class="fas fa-plane-departure me-2"></i> Mis Viajes
  </h2>

  <!-- Botón para agregar viaje -->
  <button class="btn btn-success mb-3" (click)="nuevoViaje()">
    <i class="fas fa-plus me-2"></i> Nuevo Viaje
  </button>

  <!-- Formulario -->
  <div *ngIf="showForm" class="card p-3 mb-4">
    <h5 class="card-title">Agregar Nuevo Viaje</h5>
    <form (ngSubmit)="agregarViaje()">
      <div class="mb-2">
        <label>País de destino</label>
        <select [(ngModel)]="nuevo.destino" name="destino" class="form-select">
          <option value="">Selecciona un país</option>
          <option *ngFor="let pais of paisesDisponibles" [value]="pais">{{ pais }}</option>
        </select>
      </div>

      <div class="mb-2">
        <label>Fecha de salida</label>
        <input type="date" [(ngModel)]="nuevo.fechaSalida" name="fechaSalida" class="form-control">
      </div>

      <div class="mb-2">
        <label>Fecha de retorno</label>
        <input type="date" [(ngModel)]="nuevo.fechaRetorno" name="fechaRetorno" class="form-control">
      </div>

      <div class="mb-2">
        <label>Título del viaje</label>
        <input type="text" [(ngModel)]="nuevo.titulo" name="titulo" class="form-control">
      </div>

      <div class="mb-2">
        <label>Notas</label>
        <textarea [(ngModel)]="nuevo.notas" name="notas" class="form-control"></textarea>
      </div>

      <button type="submit" class="btn btn-primary mt-2">Agregar</button>
    </form>
  </div>

  <!-- Listado de viajes -->
  <div *ngFor="let trip of trips" class="card mb-3 shadow-sm p-3">
    <h5 class="card-title">{{ trip.destination }}</h5>
    <p class="card-text"><strong>Fecha:</strong> {{ trip.date }}</p>
    <p class="card-text"><strong>Notas:</strong> {{ trip.notes }}</p>
  </div>
</div>
